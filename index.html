
<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Кинорадар</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #f3f5f8;
  color: #222;
  max-width: 700px;
  margin: 30px auto;
  padding: 15px;
}
h1 { text-align: center; }
.tabs {
  display: flex;
  gap: 10px;
  margin: 25px 0;
}
button {
  padding: 12px 16px;
  border: 0;
  border-radius: 6px;
  background: #2459a6;
  color: white;
  cursor: pointer;
  font-size: 15px;
}
.tabs button { flex: 1; }
button.active { background: #163d75; }
.panel {
  background: white;
  padding: 20px;
  border-radius: 8px;
}
input {
  box-sizing: border-box;
  width: 100%;
  padding: 12px;
  margin: 12px 0;
  border: 1px solid #bbb;
  border-radius: 5px;
  font-size: 16px;
}
.hidden { display: none; }
.result {
  display: block;
  margin: 12px 0;
  padding: 13px;
  background: #edf3fb;
  border-radius: 6px;
  color: #174d91;
  text-decoration: none;
}
.result:hover { background: #dce9f8; }
.movie {
  padding: 10px;
  border-bottom: 1px solid #ddd;
}
small { color: #666; }
</style>
</head>
<body>

<h1>Кинорадар</h1>

<div class="tabs">
  <button id="searchTab" class="active" onclick="showTab('search')">
    Найти фильм
  </button>
  <button id="trackTab" onclick="showTab('track')">
    Отслеживать появление
  </button>
</div>

<div id="searchPanel" class="panel">
  <h2>Поиск доступного фильма</h2>
  <p>Введи название фильма. Кинорадар подготовит ссылки для поиска.</p>

  <input id="movieSearch" type="text"
    placeholder="Например, Грань будущего">

  <button onclick="searchMovie()">Искать фильм</button>

  <div id="searchResults"></div>
</div>

<div id="trackPanel" class="panel hidden">
  <h2>Отслеживание нового фильма</h2>
  <p>Добавь фильм, которого пока нет в доступных источниках.</p>

  <input id="movieTrack" type="text"
    placeholder="Название фильма">

  <button onclick="addMovie()">Добавить отслеживание</button>

  <h3>Мои фильмы</h3>
  <div id="movieList"></div>
</div>

<script>
function showTab(tab) {
  document.getElementById('searchPanel').classList.toggle(
    'hidden', tab !== 'search'
  );
  document.getElementById('trackPanel').classList.toggle(
    'hidden', tab !== 'track'
  );
  document.getElementById('searchTab').classList.toggle(
    'active', tab === 'search'
  );
  document.getElementById('trackTab').classList.toggle(
    'active', tab === 'track'
  );
  if (tab === 'track') showMovies();
}

function searchMovie() {
  var title = document.getElementById('movieSearch').value.trim();
  var results = document.getElementById('searchResults');

  if (!title) {
    results.innerHTML = '<p>Сначала введи название фильма.</p>';
    return;
  }

  var vkQuery = encodeURIComponent(title);
  var yandexQuery = encodeURIComponent(
    title + ' смотреть онлайн'
  );
  

  results.innerHTML =
    '<h3>Где искать «' + escapeHTML(title) + '»</h3>' +
    '<a class="result" target="_blank" rel="noopener" href="https://vk.com/video?q=' +
    vkQuery + '">Искать видео ВКонтакте</a>' +
    
    '<a class="result" target="_blank" rel="noopener" href="https://yandex.ru/search/?text=' +
    yandexQuery + '">Искать в Яндексе на других площадках</a>';
}

function escapeHTML(text) {
  return text.replace(/[&<>"']/g, function(ch) {
    return {
      '&': '&amp;',
      '<': '&lt;',
      '>': '&gt;',
      '"': '&quot;',
      "'": '&#39;'
    }[ch];
  });
}

function getMovies() {
  try {
    return JSON.parse(localStorage.getItem('kinoradar_movies') || '[]');
  } catch (e) {
    return [];
  }
}

function addMovie() {
  var input = document.getElementById('movieTrack');
  var title = input.value.trim();

  if (!title) {
    alert('Введи название фильма.');
    return;
  }

  var movies = getMovies();

  if (movies.indexOf(title) !== -1) {
    alert('Этот фильм уже есть в списке.');
    return;
  }

  movies.push(title);
  localStorage.setItem('kinoradar_movies', JSON.stringify(movies));
  input.value = '';
  showMovies();
}

function showMovies() {
  var movies = getMovies();
  var list = document.getElementById('movieList');

  if (movies.length === 0) {
    list.innerHTML = '<p>Пока фильмов нет.</p>';
    return;
  }

  list.innerHTML = '';

  movies.forEach(function(movie, index) {
    var item = document.createElement('div');
    item.className = 'movie';

    var name = document.createElement('span');
    name.textContent = movie;

    var remove = document.createElement('button');
    remove.textContent = 'Удалить';
    remove.style.marginLeft = '12px';
    remove.onclick = function() {
      var current = getMovies();
      current.splice(index, 1);
      localStorage.setItem('kinoradar_movies',
        JSON.stringify(current));
      showMovies();
    };

    item.appendChild(name);
    item.appendChild(remove);
    list.appendChild(item);
  });
}

showMovies();
</script>

</body>
</html>
